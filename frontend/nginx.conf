server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API pieprasījumi tiek pārsūtīti uz ASP.NET Core konteineru.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React Router: visi pārējie ceļi atgriež index.html.
    location / {
        try_files $uri /index.html;
    }
}
