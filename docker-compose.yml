services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: groupmate
      POSTGRES_USER: groupmate
      POSTGRES_PASSWORD: groupmate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groupmate -d groupmate"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=groupmate;Username=groupmate;Password=groupmate"
    ports:
      - "5080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

  # Datubāzes pārlūks – ērti parādīt video, ka dati tiešām tiek saglabāti PostgreSQL.
  adminer:
    image: adminer:4
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  pgdata:
